<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Notes | amee.my</title>
  <meta name="description"
    content="Read my blog posts on fullstack development, TALL stack, DevOps, and technology insights.">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700&display=swap"
    rel="stylesheet">

  <!-- Scripts -->
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>

  <style type="text/css">
    @theme {
      --color-primary-50: oklch(0.966 0.007 247.896);
      --color-primary-100: oklch(0.928 0.014 249.357);
      --color-primary-200: oklch(0.859 0.029 252.196);
      --color-primary-300: oklch(0.785 0.043 255.708);
      --color-primary-400: oklch(0.707 0.059 259.731);
      --color-primary-500: oklch(0.622 0.076 264.402);
      --color-primary-600: oklch(0.519 0.101 268.329);
      --color-primary-700: oklch(0.435 0.113 270.801);
      --color-primary-800: oklch(0.352 0.106 272.95);
      --color-primary-900: oklch(0.284 0.089 274.557);
      --color-primary-950: oklch(0.184 0.064 276.536);
      --color-indigo-600: oklch(0.519 0.101 268.329);
      --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      --font-serif: "Outfit", ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
    }

    /* Base Styles */
    body {
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #020617;
      color: #f1f5f9;
      transition: background-color 0.3s, color 0.3s;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: var(--font-serif) !important;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: #f1f5f9;
    }

    /* Glassmorphism */
    .glass {
      background-color: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(51, 65, 85, 0.4);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }

    .card {
      border-radius: 1rem;
      overflow: hidden;
      transition: all 0.3s;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.5rem;
      border-radius: 0.75rem;
      font-weight: 600;
      transition: all 0.2s;
      cursor: pointer;
      font-size: 0.875rem;
      line-height: 1.25rem;
    }

    .btn-primary {
      background-color: #4f46e5 !important;
      color: white !important;
    }

    .btn-primary:hover {
      background-color: #4338ca !important;
      transform: translateY(-1px);
    }

    .btn-ghost {
      color: #94a3b8;
      border: 1px solid #1e293b;
    }

    .btn-ghost:hover {
      background-color: #1e293b;
    }

    /* Animated Blobs */
    .blob {
      position: absolute;
      border-radius: 50%;
      mix-blend-mode: multiply;
      filter: blur(80px);
      opacity: 0.3;
      animation: blob-anim 7s infinite;
    }

    @keyframes blob-anim {
      0% {
        transform: translate(0px, 0px) scale(1);
      }

      33% {
        transform: translate(30px, -50px) scale(1.1);
      }

      66% {
        transform: translate(-20px, 20px) scale(0.9);
      }

      100% {
        transform: translate(0px, 0px) scale(1);
      }
    }

    .animation-delay-2000 {
      animation-delay: 2s;
    }

    .animation-delay-4000 {
      animation-delay: 4s;
    }
  </style>
</head>

<body class="bg-slate-950 text-slate-100 antialiased selection:bg-indigo-900">
  <div id="navbar"></div>

  <!-- Background Animated Blobs -->
  <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
    <div class="blob w-96 h-96 bg-indigo-400 opacity-20" style="top: -10%; left: -10%;"></div>
    <div class="blob w-[30rem] h-[30rem] bg-fuchsia-400 opacity-20 animation-delay-2000" style="top: 10%; right: -10%;">
    </div>
    <div class="blob w-96 h-96 bg-cyan-400 opacity-20 animation-delay-4000" style="bottom: -10%; left: 10%;"></div>
    <div class="blob w-[25rem] h-[25rem] bg-indigo-300 opacity-20 animation-delay-2000"
      style="bottom: 10%; right: 10%;"></div>
  </div>

  <main class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-24 pb-12" x-data="blogSystem()">
    <div class="glass min-h-screen rounded-[2.5rem] border-slate-800/40 shadow-2xl overflow-hidden p-8 lg:p-12">
      <header class="mb-16">
        <h1 class="text-4xl lg:text-6xl font-serif font-bold tracking-tight mb-6">My Notes</h1>
        <p class="text-xl text-slate-400 max-w-2xl">
          Short-form thoughts and long-form guides. Filter by tag to explore specific topics.
        </p>
      </header>

      <div class="flex flex-col md:flex-row gap-4 mb-12">
        <div class="grow max-w-xs">
          <label for="tagFilter" class="sr-only">Filter by tag</label>
          <select id="tagFilter" x-model="selectedTag"
            class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
            <option value="">All Topics</option>
            <template x-for="tag in allTags" :key="tag">
              <option :value="tag" x-text="tag"></option>
            </template>
          </select>
        </div>
      </div>

      <!-- Posts Grid -->
      <div id="posts-list" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8 min-h-[400px]">
        <template x-for="post in filteredPosts" :key="post.folder">
          <a :href="'../posts/' + post.folder"
            class="glass group p-6 rounded-2xl flex flex-col hover:-translate-y-1 transition-all duration-300">
            <div class="text-[10px] font-bold uppercase tracking-widest text-indigo-500 mb-3" x-text="post.date"></div>
            <h2 class="text-xl font-bold mb-3 group-hover:text-indigo-400 transition-colors" x-text="post.title"></h2>
            <p class="text-sm text-slate-400 line-clamp-3 leading-relaxed mb-6 grow" x-text="post.excerpt"></p>
            <div class="flex flex-wrap gap-2">
              <template x-for="tag in post.tags" :key="tag">
                <span class="px-2 py-0.5 rounded text-[10px] bg-slate-800 text-slate-400 font-medium"
                  x-text="tag"></span>
              </template>
            </div>
          </a>
        </template>
        <div x-show="filteredPosts.length === 0" class="col-span-full py-20 text-center">
          <p class="text-slate-500 italic">No posts found for this topic.</p>
        </div>
      </div>

      <!-- Simple Pagination (Future improvement: functional) -->
      <nav x-show="posts.length > itemsPerPage" class="mt-16 flex justify-center items-center gap-4">
        <button class="btn btn-ghost border border-slate-800 opacity-50 cursor-not-allowed">←
          Older</button>
        <span class="text-sm font-medium text-slate-400">Archive</span>
        <button class="btn btn-ghost border border-slate-800 opacity-50 cursor-not-allowed">Newer
          →</button>
      </nav>
    </div>
  </main>

  <div id="footer"></div>

  <script type="text/javascript">
    function blogSystem() {
      return {
        posts: [],
        allTags: [],
        selectedTag: '',
        itemsPerPage: 9,
        async init() {
          try {
            const res = await fetch("../posts/");
            const txt = await res.text();
            const parser = new DOMParser();
            const html = parser.parseFromString(txt, "text/html");
            const links = Array.from(html.querySelectorAll("a"))
              .map(a => a.getAttribute("href"))
              .filter(h => h && h.endsWith("/") && h.length > 1 && !h.includes("://") && h !== "../" && h !== "./")
              .reverse(); // Newest first

            const tagSet = new Set();
            if (links.length === 0) {
              throw new Error("No posts found");
            }

            for (const folder of links) {
              const r = await fetch(`../posts/${folder}index.html`);
              const t = await r.text();
              const d = parser.parseFromString(t, "text/html");
              const title = d.querySelector("h1")?.textContent?.trim() || folder.replace("/", "");
              const date = d.querySelector(".secondary")?.textContent?.trim() || "Unknown date";
              const excerpt = d.querySelector("p:not(.secondary)")?.textContent?.trim() || "";
              const tags = Array.from(d.querySelectorAll(".tags span")).map(s => s.textContent.trim());
              tags.forEach(tag => tagSet.add(tag));

              this.posts.push({ folder, title, date, excerpt, tags });
            }
            this.allTags = Array.from(tagSet).sort();
          } catch (e) {
            console.warn("Using fallback data for Blog.");
            this.posts = [
              { folder: "mock-note-1", title: "Mastering the TALL Stack", date: "2025-11-15", excerpt: "How I built a scalable invitation system using Tailwind, Alpine, Laravel, and Livewire.", tags: ["Laravel", "Tailwind"] },
              { folder: "mock-note-2", title: "The Future of DevOps", date: "2025-11-10", excerpt: "Exploring how automated CI/CD pipelines are changing the game for solo developers.", tags: ["DevOps", "CI/CD"] }
            ];
            const tagSet = new Set();
            this.posts.forEach(p => p.tags.forEach(t => tagSet.add(t)));
            this.allTags = Array.from(tagSet).sort();
          }
        },
        get filteredPosts() {
          if (!this.selectedTag) return this.posts;
          return this.posts.filter(p => p.tags.includes(this.selectedTag));
        }
      }
    }

    async function loadPartials() {
      try {
        const footerRes = await fetch("../_partials/_footer.html");
        const footerTxt = await footerRes.text();
        document.getElementById("footer").innerHTML = footerTxt.replace(/href="(?!http|#)/g, 'href="../');

        const navbarRes = await fetch("../_partials/_navbar.html");
        const navbarTxt = await navbarRes.text();
        document.getElementById("navbar").innerHTML = navbarTxt.replace(/href="(?!http|#)/g, 'href="../');
      } catch (error) {
        console.error("Error loading partials:", error);
      }
    }
    loadPartials();
  </script>
</body>

</html>
