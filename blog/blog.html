<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes & Logs | Amee</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style type="text/css">
    @theme {
      --color-primary: #000000;
      --color-secondary: #444444;
      --font-sans: "Inter", system-ui, -apple-system, sans-serif;
      --font-mono: "IBM Plex Mono", "SF Mono", "Fira Code", monospace;
    }

    /* Technical Whitepaper Base */
    body {
      font-family: var(--font-sans);
      background-color: #ffffff;
      color: #111111;
      -webkit-font-smoothing: initial;
      -moz-osx-font-smoothing: initial;
      cursor: crosshair;
      line-height: 1.5;
    }

    h1, h2, h3, h4, h5, h6 {
      font-weight: 700;
      letter-spacing: -0.05em;
      color: #000000;
      text-transform: uppercase;
    }

    .mono { font-family: var(--font-mono); font-size: 0.75rem; }

    /* Architecture Grid */
    .grid-paper {
      background-image: 
        linear-gradient(#f0f0f0 1px, transparent 1px),
        linear-gradient(90deg, #f0f0f0 1px, transparent 1px);
      background-size: 20px 20px;
    }

    /* High Density Elements */
    .filter-select {
      appearance: none;
      background-color: #ffffff;
      border: 1px solid #000000;
      padding: 0.5rem 2.5rem 0.5rem 1rem;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      text-transform: uppercase;
      font-weight: 600;
      outline: none;
    }

    .post-row {
      display: grid;
      grid-template-cols: 80px 1fr;
      gap: 1rem;
      padding: 1.25rem 0.5rem;
      border-bottom: 1px solid #e5e7eb;
      transition: background-color 0.1s;
    }
    @media (min-width: 768px) {
        .post-row {
            grid-template-cols: 100px 1fr 120px;
            gap: 2rem;
            padding: 1.5rem 1rem;
        }
    }
    .post-row:hover { background-color: #f9fafb; }

    [x-cloak] { display: none !important; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #ffffff; }
    ::-webkit-scrollbar-thumb { background: #000000; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>

<body class="bg-white">
  <div id="navbar"></div>

  <!-- Technical Overlay -->
  <div class="fixed inset-0 z-0 pointer-events-none grid-paper opacity-50"></div>

  <main class="relative z-10 max-w-7xl mx-auto pt-24 pb-12" x-data="blogSystem()">
    <div class="min-h-screen overflow-hidden p-4 sm:p-8 lg:p-12">
      <header class="mb-12 md:mb-16 pt-8">
        <h1 class="text-4xl sm:text-6xl md:text-8xl font-black tracking-tighter mb-6 text-black leading-none">Notes</h1>
        <p class="mono text-[10px] text-secondary uppercase tracking-[0.4em] font-bold">
            Formal technical records and software architecture analysis.
        </p>
      </header>

      <div class="mb-12">
        <div class="inline-block relative">
          <select id="tagFilter" x-model="selectedTag" class="filter-select">
            <option value="">Module Classifications</option>
            <template x-for="tag in allTags" :key="tag">
              <option :value="tag" x-text="tag"></option>
            </template>
          </select>
          <svg class="pointer-events-none absolute right-4 top-1/2 -translate-y-1/2 h-4 w-4 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path d="M19 9l-7 7-7-7" stroke-width="1.5" />
          </svg>
        </div>
      </div>

      <!-- Logs List -->
      <div id="posts-list" class="border-t border-black">
        <template x-for="post in paginatedPosts" :key="post.folder">
          <a :href="'../posts/' + post.folder" class="post-row group">
            <div class="mono text-[10px] text-gray-400 py-1" x-text="post.date"></div>
            <div class="col-span-1 md:col-span-1">
              <h2 class="text-base sm:text-lg font-bold mb-1 group-hover:underline" x-text="post.title"></h2>
              <div class="flex flex-wrap gap-2">
                <template x-for="tag in post.tags" :key="tag">
                  <span class="mono text-[8px] text-gray-400 uppercase tracking-widest" x-text="tag"></span>
                </template>
              </div>
            </div>
            <div class="hidden md:flex justify-end items-center">
              <span class="mono text-[10px] opacity-0 group-hover:opacity-100 transition-opacity">READ_LOG →</span>
            </div>
          </a>
        </template>
        <div x-show="paginatedPosts.length === 0" class="py-40 text-center border-b border-black">
          <p class="mono text-[10px] text-gray-400 uppercase tracking-widest">No matching logs found.</p>
        </div>
      </div>

      <!-- Simple Pagination -->
      <nav x-show="totalPages > 1" class="mt-16 flex justify-center items-center gap-4">
        <button 
          @click="currentPage > 1 && currentPage--" 
          :class="currentPage === 1 ? 'opacity-30 cursor-not-allowed' : 'hover:bg-black hover:text-white'"
          class="mono text-[10px] border border-black px-4 py-2 transition-colors">← NEWER_LOGS</button>
        
        <div class="mono text-[10px] font-bold text-black uppercase tracking-widest px-8">
            Archive Page <span x-text="currentPage"></span> / <span x-text="totalPages"></span>
        </div>

        <button 
          @click="currentPage < totalPages && currentPage++" 
          :class="currentPage === totalPages ? 'opacity-30 cursor-not-allowed' : 'hover:bg-black hover:text-white'"
          class="mono text-[10px] border border-black px-4 py-2 transition-colors">OLDER_LOGS →</button>
      </nav>
    </div>
  </main>

  <div id="footer"></div>

  <script type="text/javascript">
    function blogSystem() {
      return {
        posts: [],
        allTags: [],
        selectedTag: '',
        currentPage: 1,
        itemsPerPage: 30,
        async init() {
          try {
            const res = await fetch("./posts/");
            const txt = await res.text();
            const parser = new DOMParser();
            const html = parser.parseFromString(txt, "text/html");
            const links = Array.from(html.querySelectorAll("a"))
              .map(a => a.getAttribute("href"))
              .filter(h => h && h.endsWith("/") && h.length > 1 && !h.includes("://") && h !== "../" && h !== "./")
              .reverse();

            const tagSet = new Set();
            if (links.length === 0) throw new Error("No posts found");

            for (const folder of links) {
              const r = await fetch(`./posts/${folder}index.html`);
              const t = await r.text();
              const d = parser.parseFromString(t, "text/html");
              const title = d.querySelector("h1")?.textContent?.trim() || folder.replace("/", "");
              const date = d.querySelector(".secondary")?.textContent?.trim() || "Unknown";
              const excerpt = d.querySelector("p:not(.secondary)")?.textContent?.trim() || "";
              const tags = Array.from(d.querySelectorAll(".tags span")).map(s => s.textContent.trim());
              tags.forEach(tag => tagSet.add(tag));
              this.posts.push({ folder, title, date, excerpt, tags });
            }
            this.allTags = Array.from(tagSet).sort();
          } catch (e) {
            this.posts = [
              { folder: "mock-1", title: "Domain Driven Design in Laravel", date: "2025-11-15", excerpt: "Implementation patterns for complex business logic.", tags: ["Laravel", "Architecture"] },
              { folder: "mock-2", title: "Go Microservices at Scale", date: "2025-11-10", excerpt: "Exploring concurrency and robustness in production Go.", tags: ["Go", "Distributed Systems"] }
            ];
            const tagSet = new Set();
            this.posts.forEach(p => p.tags.forEach(t => tagSet.add(t)));
            this.allTags = Array.from(tagSet).sort();
          }
        },
        get filteredPosts() {
          if (!this.selectedTag) return this.posts;
          return this.posts.filter(p => p.tags.includes(this.selectedTag));
        },
        get totalPages() {
          return Math.ceil(this.filteredPosts.length / this.itemsPerPage);
        },
        get paginatedPosts() {
          const start = (this.currentPage - 1) * this.itemsPerPage;
          return this.filteredPosts.slice(start, start + this.itemsPerPage);
        }
      }
    }

    async function loadPartials() {
      try {
        const footerRes = await fetch("../_partials/_footer.html");
        const footerTxt = await footerRes.text();
        const footerEl = document.getElementById("footer");
        footerEl.innerHTML = footerTxt.replace(/href="(?!http|#)/g, 'href="../');

        const navbarRes = await fetch("../_partials/_navbar.html");
        const navbarTxt = await navbarRes.text();
        const navbarEl = document.getElementById("navbar");
        navbarEl.innerHTML = navbarTxt.replace(/href="(?!http|#)/g, 'href="../');
      } catch (error) {
        console.error("Error loading partials:", error);
      }
    }
    loadPartials();
  </script>
</body>

</html>
