<div class="fixed top-0 left-0 right-0 z-50 px-4 sm:px-6 lg:px-8 py-4" x-data="{ 
        mobileMenuOpen: false, 
        scrolled: false 
    }" @scroll.window="scrolled = (window.pageYOffset > 20)" x-cloak>
    <header
        :class="(scrolled || mobileMenuOpen) ? 'glass border-slate-800/50 shadow-lg' : 'bg-transparent border-transparent'"
        class="max-w-7xl mx-auto rounded-3xl border transition-all duration-300">
        <nav class="flex items-center justify-between px-6 py-4">
            <div class="flex items-center">
                <a href="index.html"
                    class="text-xl font-serif font-bold tracking-tight text-white group flex items-center gap-2">
                    <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white text-sm">A
                    </div>
                    <span class="hidden sm:inline">amee.my</span>
                </a>
            </div>

            <!-- Desktop Menu -->
            <div class="hidden md:flex items-center space-x-1">
                <!--
                <a href="index.html"
                    class="px-4 py-2 rounded-xl text-sm font-medium text-slate-400 hover:text-indigo-400 hover:bg-slate-800/50 transition-all">Home</a>
                -->
                <a href="blog/blog.html"
                    class="px-4 py-2 rounded-xl text-sm font-medium text-slate-400 hover:text-indigo-400 hover:bg-slate-800/50 transition-all">My
                    Notes</a>
            </div>

            <!-- Mobile menu button -->
            <div class="md:hidden flex items-center">
                <button @click="mobileMenuOpen = !mobileMenuOpen"
                    class="p-2 rounded-xl text-slate-300 hover:bg-slate-800 transition-all">
                    <span class="sr-only">Open main menu</span>
                    <span x-show="!mobileMenuOpen">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </span>
                    <span x-show="mobileMenuOpen" x-cloak>
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </span>
                </button>
            </div>
        </nav>

        <!-- Mobile menu -->
        <div x-show="mobileMenuOpen" x-transition:enter="transition ease-out duration-200"
            x-transition:enter-start="opacity-0 -translate-y-4" x-transition:enter-end="opacity-100 translate-y-0"
            class="md:hidden px-6 pb-6 pt-2 space-y-1">
            <!--
            <a href="index.html"
                class="block px-4 py-3 rounded-xl text-base font-medium text-slate-200 hover:bg-slate-800/50 transition-all">Home</a>
            -->
            <a href="blog/blog.html"
                class="block px-4 py-3 rounded-xl text-base font-medium text-slate-200 hover:bg-slate-800/50 transition-all">My
                Notes</a>
        </div>
    </header>
</div>
